github_url = "https://github.com/TroyNSmith/inverse"

[version]
current = "0.1.1"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[[file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[file]]
src = "src/inverse/__init__.py"
search = '__version__ = "{current_version}"'

[[before_commit]]
name = "Update changelog"
cmd = "uv run keepachangelog release {new_version}"

[[before_commit]]
name = "Add changelog to commit"
cmd = "git add CHANGELOG.md"

[[before_commit]]
name = "Update lockfile"
cmd = "uv lock"

[[before_commit]]
name = "Add lockfile to commit"
cmd = "git add uv.lock"